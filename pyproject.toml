[project]
name = "napas-qr-python"
version = "0.2.0"
description = "VietQR for python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8.2,<4.0"
authors = [{ name = "shinxz12", email = "ngocbthe@gmail.com" }]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]
dependencies = [
    "segno>=1.6.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/shinxz12/napas-qr-python"
Repository = "https://github.com/shinxz12/napas-qr-python"
Documentation = "https://shinxz12.github.io/napas-qr-python"

[project.scripts]
napas_qr = "qr_pay.cli:main"

[dependency-groups]
test = [
    "pytest>=6.2.4",
    "pytest-cov>=2.12.0",
    "black>=22.3.0",
    "isort>=5.8.0",
    "flake8>=3.9.2",
    "flake8-docstrings>=1.6.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]
doc = [
    "mkdocs>=1.1.2",
    "mkdocs-include-markdown-plugin>=1.0.0",
    "mkdocs-material>=6.1.7",
    "mkdocstrings[python]>=0.15.2",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-autorefs>=0.2.1",
]
dev = [
    "pre-commit>=2.12.0",
    "twine>=3.3.0",
    { include-group = "test" },
    { include-group = "doc" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qr_pay"]

[tool.hatch.build.targets.sdist]
include = ["qr_pay", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_gitignore = true
